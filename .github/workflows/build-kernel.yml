# Yume Kernel v3.1.2 云编译 workflow（GitHub Actions）

# 用法（无需 fork 源码仓库）：
#   1. 在自己的 GitHub 账号新建一个空仓库，例如 crux-kernel-build
#      （勾选 "Add a README file" 完成初始化）
#   2. 在该仓库新建文件 .github/workflows/build-kernel.yml
#      把本文件的全部内容粘进去并提交
#   3. 打开 Actions 标签 → "Build Yume Kernel v3.1.2" → Run workflow
#      （ksu 选项保持 false = 干净 boot）
#   4. 编译完成后在 run 页面底部下载 artifact：crux-yume-v312-kernel
#      解压到 D:\crux-roms\kernel\
#
# 说明：
#   - workflow 直接拉取原作者仓库的 v3.1.2 标签，不需要你 fork 或下载源码
#   - 编译在云端 Ubuntu 进行，不需要本机装 clang / WSL
#   - defconfig 已自动修改：关 KSU/SUSFS（保持 boot 干净），
#     保留 BPF/CGROUP_FREEZER/PSTORE（新 Android 必需）
#   - 产物：Image.gz-dtb（内核）+ dtbo.img + 配置快照

name: Build Yume Kernel v3.1.2 + PSTORE LOG

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Keep KernelSU enabled? (false = clean boot, recommended)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source v3.1.2
        uses: actions/checkout@v4
        with:
          repository: nzlnice/android_kernel_xiaomi_crux
          ref: v3.1.2
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio curl wget git xz-utils zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Download Android Clang r547379 (LLVM 20)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang"
          curl -L --retry 3 --connect-timeout 30 \
            -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/toolchain/clang"
          "$GITHUB_WORKSPACE/toolchain/clang/bin/clang" --version

      - name: Patch defconfig
        env:
          KSU: ${{ github.event.inputs.ksu }}
        run: |
          CFG=arch/arm64/configs/crux_defconfig
          if [ "$KSU" = "false" ]; then
            sed -i 's/^CONFIG_KSU=y/# CONFIG_KSU is not set/' "$CFG"
            sed -i -E 's/^CONFIG_KSU_SUSFS[A-Z0-9_]*=y/# & is not set/' "$CFG"
            echo "KSU/SUSFS disabled for clean boot"
          else
            echo "KSU/SUSFS kept enabled"
          fi
          # 确保新 Android 必需项打开（幂等）
          grep -q '^CONFIG_CGROUP_FREEZER=y' "$CFG" || echo 'CONFIG_CGROUP_FREEZER=y' >> "$CFG"
          grep -q '^CONFIG_BPF_SYSCALL=y' "$CFG" || echo 'CONFIG_BPF_SYSCALL=y' >> "$CFG"
          grep -q '^CONFIG_PSTORE=y' "$CFG" || echo 'CONFIG_PSTORE=y' >> "$CFG"
          # === 崩溃日志通道：pstore/blk 把 dmesg 写到 oops 分区(块设备后端) ===
          # ramoops 内存后端因 dtb 地址重叠不可靠，改用 blk 后端写到持久分区
          for opt in \
            'CONFIG_PSTORE_BLK=y' \
            'CONFIG_PSTORE_BLK_BLKDEV="/dev/block/by-name/oops"' \
            'CONFIG_PSTORE_BLK_KMSG_SIZE=1048576' \
            'CONFIG_PSTORE_BLK_PMSG_SIZE=262144' \
            'CONFIG_PSTORE_CONSOLE=y' \
            'CONFIG_PSTORE_DMESG=y' \
            'CONFIG_PSTORE_PMSG=y' \
            'CONFIG_PSTORE_RAMOOPS=y' \
            'CONFIG_PSTORE_COMPRESS=y' \
            'CONFIG_PSTORE_ZSTD_COMPRESS=y'; do
            key="${opt%%=*}"
            grep -q "^${key}=" "$CFG" || echo "$opt" >> "$CFG"
          done
          # blk 后端需要 pstore zone 用 minor 机制，确保 core 打开
          grep -q '^CONFIG_MTD=y' "$CFG" || echo 'CONFIG_MTD=y' >> "$CFG"
          echo "=== 关键配置复核 ==="
          grep -E 'CONFIG_(KSU|PSTORE|BPF|CGROUP_FREEZER|LOCALVERSION|MTD)' "$CFG" || true

      - name: Build kernel
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          MAKE_ARGS="O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make -j$(nproc) $MAKE_ARGS crux_defconfig
          make -j$(nproc) $MAKE_ARGS
          echo "=== 构建产物 ==="
          find out -type f \( -name 'Image*' -o -name '*.dtb' -o -name 'dtbo.img' \) -printf '%p %s bytes\n' | head -40

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find out -type f \( -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' \
            -o -name 'dtbo.img' -o -name '*.dtb' \) -exec cp -v {} artifacts/ \;
          cp -v arch/arm64/configs/crux_defconfig artifacts/defconfig-used.txt
          echo "=== 打包内容 ==="
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crux-yume-v312-kernel
          path: artifacts/
          retention-days: 30
