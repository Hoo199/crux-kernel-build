# Yume Kernel v3.1.2 —— PSTORE 调试版云编译
#
# 目的：修好 pstore，让 OS4 第一次阶段 init 的内核日志能跨重启留下。
# 原版内核打印 "pstore: allocate compression buffer error!"，
# 原因是 CONFIG_PSTORE_COMPRESS_DEFAULT 未设置 → zbackend 为 NULL。
# 本 workflow 打开 zlib 后端 + 默认压缩器，同时打开 DEVTMPFS 便于首阶段。
#
# 用法：
#   1. 打开你之前编译内核用的 GitHub 仓库
#   2. 新建 .github/workflows/build-pstore-debug.yml，粘贴本文件全部内容并提交
#   3. Actions 标签 → "Build Yume Kernel (PSTORE DEBUG)" → Run workflow
#   4. 跑完后在 run 页面底部下载 artifact: crux-yume-v312-pstore-debug
#   5. 解压到 D:\crux-roms\kernel\pstore-debug\ 并告诉我

name: Build Yume Kernel (PSTORE DEBUG)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source v3.1.2
        uses: actions/checkout@v4
        with:
          repository: nzlnice/android_kernel_xiaomi_crux
          ref: v3.1.2
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio curl wget git xz-utils zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Download Android Clang r547379
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang"
          curl -L --retry 3 --connect-timeout 30 \
            -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/toolchain/clang"
          "$GITHUB_WORKSPACE/toolchain/clang/bin/clang" --version

      - name: Patch defconfig for pstore debug
        run: |
          CFG=arch/arm64/configs/crux_defconfig
          chmod +x scripts/config

          # 干净内核：关掉 KSU/SUSFS
          sed -i 's/^CONFIG_KSU=y/# CONFIG_KSU is not set/' "$CFG"
          sed -i -E 's/^CONFIG_KSU_SUSFS[A-Z0-9_]*=y/# & is not set/' "$CFG"

          # 新 Android 必需项
          for c in CONFIG_CGROUP_FREEZER=y CONFIG_BPF_SYSCALL=y \
                   CONFIG_PSTORE=y CONFIG_PSTORE_CONSOLE=y CONFIG_PSTORE_RAM=y \
                   CONFIG_PSTORE_ZLIB_COMPRESS=y CONFIG_DEVTMPFS=y \
                   CONFIG_DEVTMPFS_MOUNT=y; do
            k=${c%%=*}
            grep -q "^$k=" "$CFG" || echo "$c" >> "$CFG"
            sed -i "s/^# $k is not set/$c/" "$CFG"
          done

          # 关键：设置默认压缩器，否则 zbackend=NULL → 压缩缓冲分配失败
          scripts/config --file "$CFG" --set-str PSTORE_COMPRESS_DEFAULT zlib

          # 确认没有互相冲突的压缩后端
          sed -i 's/^CONFIG_PSTORE_LZO_COMPRESS=y/# CONFIG_PSTORE_LZO_COMPRESS is not set/' "$CFG"
          sed -i 's/^CONFIG_PSTORE_LZ4_COMPRESS=y/# CONFIG_PSTORE_LZ4_COMPRESS is not set/' "$CFG"

          echo "=== 关键配置复核 ==="
          grep -E 'CONFIG_(PSTORE|DEVTMPFS|KSU|BPF|CGROUP_FREEZER|LOCALVERSION)' "$CFG" || true

      - name: Build kernel
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          MAKE_ARGS="O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make -j$(nproc) $MAKE_ARGS crux_defconfig
          make -j$(nproc) $MAKE_ARGS
          find out -type f \( -name 'Image*' -o -name '*.dtb' -o -name 'dtbo.img' \) -printf '%p %s bytes\n' | head -40

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find out -type f \( -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' \
            -o -name 'dtbo.img' -o -name '*.dtb' \) -exec cp -v {} artifacts/ \;
          cp -v arch/arm64/configs/crux_defconfig artifacts/defconfig-used.txt
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crux-yume-v312-pstore-debug
          path: artifacts/
          retention-days: 30
