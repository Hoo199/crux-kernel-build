# Yume Kernel v3.1.2 —— 屏幕控制台（fbcon）调试版
#
# 目的：让内核日志直接显示在手机屏幕上（console=tty0），
# 这样即使 adb / pstore 全不可用，也能看到 init 死在哪一行。
#
# 依赖：内核已有 CONFIG_DRM_MSM=y + CONFIG_DRM_MSM_DSI_STAGING=y，
# 本 workflow 补上 VT / fbcon / fbdev emulation。
#
# 用法：与上一个 workflow 相同，粘到 .github/workflows/build-fbcon.yml，
#       Actions → Run workflow → 下载 artifact: crux-yume-v312-fbcon

name: Build Yume Kernel (FBCON)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source v3.1.2
        uses: actions/checkout@v4
        with:
          repository: nzlnice/android_kernel_xiaomi_crux
          ref: v3.1.2
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio curl wget git xz-utils zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Download Android Clang r547379
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang"
          curl -L --retry 3 --connect-timeout 30 \
            -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$GITHUB_WORKSPACE/toolchain/clang"
          "$GITHUB_WORKSPACE/toolchain/clang/bin/clang" --version

      - name: Build config (pstore + devtmpfs + fbcon)
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          MAKE_ARGS="O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

          # 先关 KSU
          CFG=arch/arm64/configs/crux_defconfig
          sed -i 's/^CONFIG_KSU=y/# CONFIG_KSU is not set/' "$CFG"
          sed -i -E 's/^CONFIG_KSU_SUSFS[A-Z0-9_]*=y/# & is not set/' "$CFG"

          make -j$(nproc) $MAKE_ARGS crux_defconfig

          chmod +x scripts/config
          C="scripts/config --file out/.config"
          # --- 日志通道 ---
          $C --enable PSTORE
          $C --enable PSTORE_CONSOLE
          $C --enable PSTORE_RAM
          $C --enable PSTORE_ZLIB_COMPRESS
          $C --set-str PSTORE_COMPRESS_DEFAULT zlib
          $C --enable DEVTMPFS
          $C --enable DEVTMPFS_MOUNT
          # --- 屏幕控制台 ---
          $C --enable VT
          $C --enable VT_CONSOLE
          $C --enable VT_HW_CONSOLE_BINDING
          $C --enable UNIX98_PTYS
          $C --enable FRAMEBUFFER_CONSOLE
          $C --enable FRAMEBUFFER_CONSOLE_DETECT_PRIMARY
          $C --enable DRM_FBDEV_EMULATION
          $C --enable DRM_KMS_HELPER
          $C --enable FONTS
          $C --enable FONT_8x16
          # --- 新 Android 必需 ---
          $C --enable CGROUP_FREEZER
          $C --enable BPF_SYSCALL

          make -j$(nproc) $MAKE_ARGS olddefconfig

          echo "=== 关键配置复核 ==="
          grep -E 'CONFIG_(VT|FRAMEBUFFER_CONSOLE|DRM_FBDEV_EMULATION|PSTORE_COMPRESS_DEFAULT|DEVTMPFS|FONT_8x16)' out/.config || true

      - name: Build kernel
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          MAKE_ARGS="O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make -j$(nproc) $MAKE_ARGS
          find out -type f \( -name 'Image*' -o -name 'dtbo.img' \) -printf '%p %s bytes\n' | head -20

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find out -type f \( -name 'Image.gz-dtb' -o -name 'Image.gz' -o -name 'Image' \
            -o -name 'dtbo.img' -o -name 'sm8150*.dtb' \) -exec cp -v {} artifacts/ \;
          cp -v out/.config artifacts/config-used.txt
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crux-yume-v312-fbcon
          path: artifacts/
          retention-days: 30
